<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numbers &amp; Reasoning — Practice Set</title>

<!--
  ============================================================
  NUMBERS & REASONING  /  NOMBRES ET RAISONNEMENT
  A bilingual (EN/FR) math worksheet generator for cognitive
  stimulation with a capable adult. Fully offline, no build
  step, no libraries. Everything lives in this one file.

  Six toggleable categories, three difficulty levels, a
  "New set" regenerator, per-question answer buttons plus a
  global answer toggle (hidden by default), and a clean
  high-contrast print layout (worksheet on one page, answer
  key on a separate optional page).

  Design intent: calm, adult, respectful. No cartoons.
  ============================================================
-->

<style>
  :root{
    --bg:#f4f1ea;            /* warm off-white paper */
    --panel:#ffffff;
    --ink:#26303a;          /* deep slate */
    --ink-soft:#516170;
    --line:#d9d2c4;
    --accent:#2f6b6b;       /* muted teal */
    --accent-soft:#e5efee;
    --gold:#8a6d3b;
    --shadow:0 1px 3px rgba(38,48,58,.10),0 6px 18px rgba(38,48,58,.06);
    --radius:10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:19px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:900px;margin:0 auto;padding:28px 22px 80px;}

  /* ---------- Header ---------- */
  header.masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--line);
    padding-bottom:16px;margin-bottom:22px;
  }
  .masthead h1{font-size:30px;margin:0;letter-spacing:.2px;font-weight:700;}
  .masthead .subtitle{color:var(--ink-soft);font-size:16px;margin-top:4px;font-style:italic;}

  .langtoggle{display:flex;gap:0;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);}
  .langtoggle button{
    font-family:inherit;font-size:15px;padding:8px 18px;border:0;background:transparent;
    color:var(--ink-soft);cursor:pointer;letter-spacing:.5px;
  }
  .langtoggle button.active{background:var(--accent);color:#fff;font-weight:700;}

  /* ---------- Controls panel ---------- */
  .controls{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px 22px;margin-bottom:26px;
  }
  .controls .row{margin-bottom:20px;}
  .controls .row:last-child{margin-bottom:0;}
  .controls .label{
    display:block;font-size:14px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px;font-family:Arial,Helvetica,sans-serif;font-weight:700;
  }

  .segmented{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;}
  .segmented button{
    font-family:inherit;font-size:17px;padding:10px 20px;border:0;border-right:1px solid var(--line);
    background:var(--panel);color:var(--ink);cursor:pointer;
  }
  .segmented button:last-child{border-right:0;}
  .segmented button.active{background:var(--accent);color:#fff;font-weight:700;}

  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;}
  .cat{
    display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);
    border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--panel);
    transition:border-color .15s,background .15s;user-select:none;
  }
  .cat.on{border-color:var(--accent);background:var(--accent-soft);}
  .cat input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);cursor:pointer;flex:none;}
  .cat .cat-name{font-weight:700;font-size:17px;}
  .cat .cat-desc{font-size:14px;color:var(--ink-soft);line-height:1.35;font-family:Arial,Helvetica,sans-serif;}

  .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .btn{
    font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:.3px;
    padding:12px 22px;border-radius:8px;border:1px solid transparent;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover{background:#255757;}
  .btn-ghost{background:var(--panel);color:var(--ink);border-color:var(--line);}
  .btn-ghost:hover{background:#faf8f3;}

  /* ---------- Worksheet ---------- */
  .sheet-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin:8px 0 6px;}
  .sheet-head h2{font-size:23px;margin:0;}
  .sheet-meta{color:var(--ink-soft);font-size:15px;font-family:Arial,Helvetica,sans-serif;}

  ol.problems{list-style:none;counter-reset:p;margin:14px 0 0;padding:0;}
  ol.problems > li{
    counter-increment:p;position:relative;padding:18px 20px 18px 62px;margin-bottom:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);break-inside:avoid;
  }
  ol.problems > li::before{
    content:counter(p);position:absolute;left:16px;top:16px;
    width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;
    font-weight:700;font-size:17px;
  }
  .p-tag{
    display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.7px;
    text-transform:uppercase;color:var(--gold);border:1px solid #e2d6bf;background:#faf5ea;
    padding:2px 9px;border-radius:999px;margin-bottom:8px;font-weight:700;
  }
  .p-q{font-size:19px;}
  .p-q .work{color:var(--ink-soft);font-style:italic;font-size:17px;display:block;margin-top:6px;}

  /* per-question reveal button */
  .p-reveal{
    font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;letter-spacing:.3px;
    color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;
    padding:7px 14px;cursor:pointer;margin-top:12px;
  }
  .p-reveal:hover{background:var(--accent-soft);}

  .p-answer{
    margin-top:12px;padding:11px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);
    border-radius:0 6px 6px 0;font-size:17px;
  }
  .p-answer .a-label{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.7px;
    text-transform:uppercase;color:var(--accent);font-weight:700;margin-right:8px;}

  /* answer visibility: hidden until a per-question reveal, or the global toggle */
  ol.problems .p-answer{display:none;}
  ol.problems > li.revealed .p-answer{display:block;}
  body.show-answers ol.problems .p-answer{display:block;}
  body.show-answers .p-reveal{display:none;}

  /* ---------- Practice mode (one problem at a time) ---------- */
  #practice{display:none;}
  #worksheet-view{display:none;}
  body.mode-practice #practice{display:block;}
  body.mode-worksheet #worksheet-view{display:block;}
  body.mode-practice #ws-actions{display:none;}

  .practice-progress{
    font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:.8px;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;margin:2px 0 12px;
  }
  .practice-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:30px 32px;min-height:150px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  }
  .practice-card > *{max-width:100%;}
  .practice-card .pr-q,.practice-card #pr-answer{width:100%;}
  .practice-card .pr-q{font-size:24px;line-height:1.55;}
  .practice-card .pr-q .work{font-size:19px;}
  .practice-card #pr-answer{display:none;font-size:20px;margin-top:18px;}
  .practice-card.revealed #pr-answer{display:block;}
  .practice-card table.msq td{width:58px;height:58px;font-size:24px;}
  .practice-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
  .practice-actions .btn{font-size:17px;padding:13px 26px;}

  /* ---------- Fillable answer box ---------- */
  .p-response{margin-top:14px;}
  .resp-label{
    display:block;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:.5px;
    text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:6px;
  }
  .answer-input{
    width:100%;max-width:520px;font-family:inherit;font-size:19px;color:var(--ink);
    padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  }
  .answer-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .practice-card .answer-input{font-size:20px;}

  /* magic square grid */
  table.msq{border-collapse:collapse;margin:10px 0 2px;}
  table.msq td{
    width:52px;height:52px;border:1.5px solid var(--ink);text-align:center;vertical-align:middle;
    font-size:22px;font-family:Arial,Helvetica,sans-serif;font-weight:700;
  }
  table.msq td.blank{background:#f4f1ea;color:var(--accent);}

  #answerkey{margin-top:34px;padding-top:22px;border-top:2px solid var(--line);}
  #answerkey h2{font-size:22px;margin:0 0 12px;}
  #answerkey ol{padding-left:26px;}
  #answerkey li{margin-bottom:10px;break-inside:avoid;}
  body:not(.show-answers) #answerkey{display:none;}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
    padding:34px;text-align:center;color:var(--ink-soft);}

  footer.foot{margin-top:40px;text-align:center;color:var(--ink-soft);font-size:14px;
    font-family:Arial,Helvetica,sans-serif;}

  /* ---------- Print ---------- */
  @media print{
    :root{--bg:#fff;}
    body{background:#fff;font-size:13pt;}
    .wrap{max-width:none;padding:0;}
    .no-print{display:none !important;}
    .masthead{border-bottom:2px solid #000;}
    ol.problems > li,.controls,#answerkey li{box-shadow:none;}
    ol.problems > li{border:1px solid #999;}
    ol.problems > li::before{background:#000;}
    .p-tag{color:#000;border-color:#999;background:#fff;}
    .p-reveal{display:none !important;}
    /* Worksheet page stays clean — inline answers never print */
    ol.problems .p-answer{display:none !important;}
    /* Fillable answer lines DO print, as a blank line to write on (or with typed text) */
    .resp-label{color:#000;}
    .answer-input{border:0;border-bottom:1px solid #333;border-radius:0;max-width:none;width:70%;padding:2px 0;}
    /* Answer key prints on its own page, only when the global toggle is on */
    body:not(.show-answers) #answerkey{display:none;}
    body.show-answers #answerkey{display:block;page-break-before:always;}
    a[href]:after{content:"";}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1 id="ui-title">Numbers &amp; Reasoning</h1>
      <div class="subtitle" id="ui-subtitle">A practice set for keeping the mind active</div>
    </div>
    <div class="langtoggle no-print" role="group" aria-label="Language">
      <button id="lang-en" class="active" onclick="setLang('en')">English</button>
      <button id="lang-fr" onclick="setLang('fr')">Français</button>
    </div>
  </header>

  <section class="controls no-print" aria-label="Options">
    <div class="row">
      <span class="label" id="ui-mode-label">Mode</span>
      <div class="segmented" id="modes" role="group">
        <button data-mode="practice" class="active" onclick="setMode('practice')">Practice</button>
        <button data-mode="worksheet" onclick="setMode('worksheet')">Worksheet</button>
      </div>
    </div>

    <div class="row">
      <span class="label" id="ui-level-label">Difficulty</span>
      <div class="segmented" id="levels" role="group">
        <button data-level="gentle" onclick="setLevel('gentle')">Gentle</button>
        <button data-level="standard" class="active" onclick="setLevel('standard')">Standard</button>
        <button data-level="sharp" onclick="setLevel('sharp')">Sharp</button>
      </div>
    </div>

    <div class="row">
      <span class="label" id="ui-cats-label">Categories</span>
      <div class="cats" id="cats"></div>
    </div>

    <div class="row actions" id="ws-actions">
      <button class="btn btn-primary" id="ui-new" onclick="newSet()">New set</button>
      <button class="btn btn-ghost" id="ui-toggle" onclick="toggleAnswers()">Show all answers</button>
      <button class="btn btn-ghost" id="ui-print" onclick="window.print()">Print</button>
    </div>
  </section>

  <!-- Practice mode: one problem at a time -->
  <section id="practice" class="no-print" aria-label="Practice">
    <div class="practice-progress" id="practice-progress"></div>
    <div class="practice-card" id="practice-card">
      <span class="p-tag" id="pr-tag"></span>
      <div class="p-q pr-q" id="pr-q"></div>
      <div class="p-response" id="pr-response"></div>
      <div class="p-answer" id="pr-answer"></div>
    </div>
    <div class="practice-actions" id="pr-actions"></div>
  </section>

  <!-- Worksheet mode: printable list -->
  <div id="worksheet-view">
    <div class="sheet-head">
      <h2 id="ui-sheet-title">Practice Set</h2>
      <div class="sheet-meta" id="ui-sheet-meta"></div>
    </div>

    <ol class="problems" id="problems"></ol>

    <section id="answerkey" aria-label="Answer key">
      <h2 id="ui-answerkey-title">Answer Key</h2>
      <ol id="answerkey-list"></ol>
    </section>
  </div>

  <footer class="foot no-print" id="ui-foot"></footer>
</div>

<script>
"use strict";

/* ============================================================
   State & small helpers
   ============================================================ */
const state = {
  lang:'en',
  level:'standard',
  cats:{money:true,shortcuts:true,patterns:true,words:true,geometry:true,algebra:true,estimation:true,logic:true},
  showAnswers:false,
  problems:[],
  mode:'practice',   // 'practice' (one at a time) or 'worksheet' (printable list)
  current:null,      // the single problem shown in practice mode
  reveal:false,      // is the current practice answer showing?
  count:0            // how many practice problems have been shown
};

const rand = (min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const choice = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pad2 = n => (n<10?'0':'')+n;

function money(n,lang){
  const s = Number(n).toFixed(2);
  return lang==='fr' ? s.replace('.',',')+' $' : '$'+s;
}
function num(n,lang){ return lang==='fr' ? String(n).replace('.',',') : String(n); }
function grp(n,lang){ // thousands grouping for readability
  const s=String(Math.round(n));
  const sep = lang==='fr' ? ' ' : ',';
  return s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
}
function fmtTime(mins,lang){
  mins = ((mins%1440)+1440)%1440;
  let h = Math.floor(mins/60), m = mins%60;
  if(lang==='fr'){ return h+' h '+pad2(m); }
  let ap = h<12?'a.m.':'p.m.';
  let h12 = h%12; if(h12===0) h12=12;
  return h12+':'+pad2(m)+' '+ap;
}
function durText(dur,lang){
  const h=Math.floor(dur/60), m=dur%60;
  if(lang==='fr'){
    return (h?`${h} heure${h>1?'s':''}`:'')+(h&&m?' et ':'')+(m?`${m} minutes`:'');
  }
  return (h?`${h} hour${h>1?'s':''}`:'')+(h&&m?' and ':'')+(m?`${m} minutes`:'');
}

/* Shared bilingual noun banks (index-matched) */
const GOODS = [
  {en:'A coat',fr:'Un manteau'},{en:'A table lamp',fr:'Une lampe de table'},
  {en:'An armchair',fr:'Un fauteuil'},{en:'A wristwatch',fr:'Une montre'},
  {en:'A wool sweater',fr:'Un chandail de laine'},{en:'A kettle',fr:'Une bouilloire'},
  {en:'A winter jacket',fr:'Un manteau d’hiver'},{en:'A pair of boots',fr:'Une paire de bottes'}
];
const GROCERIES = [
  {en:'jars of jam',fr:'pots de confiture'},{en:'tins of soup',fr:'boîtes de soupe'},
  {en:'loaves of bread',fr:'pains'},{en:'bags of apples',fr:'sacs de pommes'},
  {en:'bottles of juice',fr:'bouteilles de jus'},{en:'boxes of tea',fr:'boîtes de thé'}
];
const DAYS = {
  en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  fr:['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi']
};

/* ============================================================
   1. Practical money
   ============================================================ */
function genMoney(level){
  const kinds = level==='gentle'
    ? ['change','discount','multi','tax']
    : ['change','discount','multi','tip','split','tax','unit'];
  const kind = choice(kinds);

  if(kind==='change'){
    let price, pay;
    if(level==='gentle'){ price = rand(2,8); pay = 10; }
    else if(level==='standard'){ price = rand(3,17) + choice([0,.25,.5,.75]); pay = price<10?10:20; }
    else { price = rand(6,38) + choice([.05,.15,.35,.45,.65,.85,.99]); pay = price<20?20:50; }
    const change = +(pay-price).toFixed(2);
    return {cat:'money',
      q:{en:`You buy a few groceries that come to ${money(price,'en')}. You hand over a ${money(pay,'en')} bill. How much change should you receive?`,
         fr:`Vous achetez quelques provisions pour un total de ${money(price,'fr')}. Vous donnez un billet de ${money(pay,'fr')}. Combien devrait-on vous rendre?`},
      a:{en:`${money(change,'en')} back.`, fr:`On devrait vous rendre ${money(change,'fr')}.`}};
  }

  if(kind==='discount'){
    let P,pct;
    if(level==='gentle'){ P = rand(2,8)*10; pct = choice([10,50]); }
    else if(level==='standard'){ P = rand(4,18)*5; pct = choice([10,20,25]); }
    else { P = rand(25,140); pct = choice([15,20,30,35]); }
    const save = +(P*pct/100).toFixed(2), sale = +(P-save).toFixed(2);
    const g = choice(GOODS);
    return {cat:'money',
      q:{en:`${g.en} is marked ${money(P,'en')} and is ${pct}% off. What is the sale price?`,
         fr:`${g.fr} est affiché à ${money(P,'fr')} avec un rabais de ${pct} %. Quel est le prix soldé?`},
      a:{en:`${pct}% of ${money(P,'en')} is ${money(save,'en')}, so the sale price is ${money(sale,'en')}.`,
         fr:`${pct} % de ${money(P,'fr')} font ${money(save,'fr')}, donc le prix soldé est ${money(sale,'fr')}.`}};
  }

  if(kind==='multi'){
    let n1,p1,n2,p2;
    if(level==='gentle'){ n1=rand(2,4); p1=rand(2,5); n2=0; }
    else if(level==='standard'){ n1=rand(3,5); p1=choice([1.5,2,2.5,3]); n2=rand(2,3); p2=choice([2,3,4]); }
    else { n1=rand(4,7); p1=choice([1.75,2.4,2.95,3.25]); n2=rand(2,4); p2=choice([1.2,1.85,2.6]); }
    let total = +(n1*p1+(n2?n2*p2:0)).toFixed(2);
    const a1=choice(GROCERIES), a2=choice(GROCERIES.filter(x=>x!==a1));
    const q = n2
      ? {en:`At the market, ${n1} ${a1.en} cost ${money(p1,'en')} each and ${n2} ${a2.en} cost ${money(p2,'en')} each. What is the total?`,
         fr:`Au marché, ${n1} ${a1.fr} coûtent ${money(p1,'fr')} chacun et ${n2} ${a2.fr} coûtent ${money(p2,'fr')} chacun. Quel est le total?`}
      : {en:`You buy ${n1} ${a1.en} at ${money(p1,'en')} each. What do they cost altogether?`,
         fr:`Vous achetez ${n1} ${a1.fr} à ${money(p1,'fr')} chacun. Combien coûtent-ils en tout?`};
    const a = n2
      ? {en:`${n1} × ${money(p1,'en')} = ${money(n1*p1,'en')}; ${n2} × ${money(p2,'en')} = ${money(n2*p2,'en')}. Total: ${money(total,'en')}.`,
         fr:`${n1} × ${money(p1,'fr')} = ${money(n1*p1,'fr')}; ${n2} × ${money(p2,'fr')} = ${money(n2*p2,'fr')}. Total : ${money(total,'fr')}.`}
      : {en:`${n1} × ${money(p1,'en')} = ${money(total,'en')}.`,
         fr:`${n1} × ${money(p1,'fr')} = ${money(total,'fr')}.`};
    return {cat:'money',q,a};
  }

  if(kind==='tip'){
    const bill = choice([24,30,36,42,45,48,55,60,72,84]);
    const pct = choice([15,18,20]);
    const tip = +(bill*pct/100).toFixed(2), total = +(bill+tip).toFixed(2);
    return {cat:'money',
      q:{en:`A restaurant bill comes to ${money(bill,'en')}. You want to leave a ${pct}% tip. How much is the tip, and what do you pay in total?`,
         fr:`L’addition au restaurant s’élève à ${money(bill,'fr')}. Vous voulez laisser un pourboire de ${pct} %. Quel est le pourboire, et combien payez-vous en tout?`},
      a:{en:`Tip = ${pct}% of ${money(bill,'en')} = ${money(tip,'en')}. Total = ${money(total,'en')}.`,
         fr:`Pourboire = ${pct} % de ${money(bill,'fr')} = ${money(tip,'fr')}. Total = ${money(total,'fr')}.`}};
  }

  if(kind==='split'){
    const n = rand(2,5);
    const per = choice([8.5,9,10.5,11,12,14,15,16]);
    const bill = +(per*n).toFixed(2);
    return {cat:'money',
      q:{en:`A dinner bill of ${money(bill,'en')} is shared equally among ${n} people. How much does each person pay?`,
         fr:`Une addition de ${money(bill,'fr')} est partagée également entre ${n} personnes. Combien chaque personne paie-t-elle?`},
      a:{en:`${money(bill,'en')} ÷ ${n} = ${money(per,'en')} each.`,
         fr:`${money(bill,'fr')} ÷ ${n} = ${money(per,'fr')} chacun.`}};
  }

  if(kind==='tax'){
    let price,pct;
    if(level==='gentle'){ price=rand(2,9)*10; pct=10; }
    else { price=choice([18,24,30,36,45,60,80]); pct=choice([5,10,13,15]); }
    const tax=+(price*pct/100).toFixed(2), total=+(price+tax).toFixed(2);
    return {cat:'money',
      q:{en:`An item costs ${money(price,'en')} before tax. With ${pct}% sales tax added, what is the final price?`,
         fr:`Un article coûte ${money(price,'fr')} avant taxes. Avec une taxe de ${pct} %, quel est le prix final?`},
      a:{en:`Tax = ${money(tax,'en')}; final price = ${money(total,'en')}.`,
         fr:`Taxe = ${money(tax,'fr')}; prix final = ${money(total,'fr')}.`}};
  }

  // unit: which is the better value?
  const perA = choice([0.6,0.7,0.8,0.9,1.0,1.1]);
  let perB = choice([0.6,0.7,0.8,0.9,1.0,1.1]); while(perB===perA) perB=choice([0.6,0.7,0.8,0.9,1.0,1.1]);
  const sizeA = choice([300,400,500,600]), sizeB = choice([300,400,500,600]);
  const priceA = +(perA*sizeA/100).toFixed(2), priceB = +(perB*sizeB/100).toFixed(2);
  const betterEn = perA<perB ? 'the first' : 'the second';
  const betterFr = perA<perB ? 'le premier' : 'le deuxième';
  const cheaper = Math.min(perA,perB);
  return {cat:'money',
    q:{en:`One package holds ${sizeA} g of coffee for ${money(priceA,'en')}. Another holds ${sizeB} g for ${money(priceB,'en')}. Which is the better value?`,
       fr:`Un emballage contient ${sizeA} g de café pour ${money(priceA,'fr')}. Un autre contient ${sizeB} g pour ${money(priceB,'fr')}. Lequel est le plus avantageux?`},
    a:{en:`Per 100 g: ${money(perA,'en')} vs ${money(perB,'en')}. ${betterEn} package is better value, at ${money(cheaper,'en')} per 100 g.`,
       fr:`Par 100 g : ${money(perA,'fr')} contre ${money(perB,'fr')}. ${betterFr.charAt(0).toUpperCase()+betterFr.slice(1)} emballage est plus avantageux, à ${money(cheaper,'fr')} par 100 g.`}};
}

/* ============================================================
   2. Mental-math shortcuts
   ============================================================ */
function genShortcuts(level){
  const kinds = level==='gentle'
    ? ['times5','times4','sum','times25','times50']
    : level==='standard'
      ? ['times25','times99','sum','times5','times50','times15','times4','sq5']
      : ['times25','times99','sum','times50','times15','sq5','diffsq','times12','times11','times9'];
  const kind = choice(kinds);

  if(kind==='times25'){
    const m = level==='gentle'?choice([4,8,12]):level==='standard'?choice([12,16,24,20,32]):choice([16,24,28,36,44]);
    return {cat:'shortcuts',
      q:{en:`Work out <b>25 × ${m}</b> in your head. Tip: 25 × 4 = 100, so build it up in fours.`,
         fr:`Calculez <b>25 × ${m}</b> de tête. Astuce : 25 × 4 = 100, donc procédez par groupes de quatre.`},
      a:{en:`25 × ${m} = 25 × 4 × ${m/4} = 100 × ${m/4} = <b>${grp(25*m,'en')}</b>.`,
         fr:`25 × ${m} = 25 × 4 × ${m/4} = 100 × ${m/4} = <b>${grp(25*m,'fr')}</b>.`}};
  }
  if(kind==='times99'){
    const k = level==='sharp'?rand(6,18):rand(3,9);
    return {cat:'shortcuts',
      q:{en:`Work out <b>99 × ${k}</b> the quick way. Tip: 99 is just 100 − 1.`,
         fr:`Calculez <b>99 × ${k}</b> par un raccourci. Astuce : 99, c’est 100 − 1.`},
      a:{en:`99 × ${k} = (100 × ${k}) − ${k} = ${grp(100*k,'en')} − ${k} = <b>${grp(99*k,'en')}</b>.`,
         fr:`99 × ${k} = (100 × ${k}) − ${k} = ${grp(100*k,'fr')} − ${k} = <b>${grp(99*k,'fr')}</b>.`}};
  }
  if(kind==='times9'){
    const k = rand(6,19);
    return {cat:'shortcuts',
      q:{en:`Work out <b>9 × ${k}</b>. Tip: 9 is 10 − 1.`, fr:`Calculez <b>9 × ${k}</b>. Astuce : 9, c’est 10 − 1.`},
      a:{en:`9 × ${k} = (10 × ${k}) − ${k} = ${10*k} − ${k} = <b>${9*k}</b>.`,
         fr:`9 × ${k} = (10 × ${k}) − ${k} = ${10*k} − ${k} = <b>${9*k}</b>.`}};
  }
  if(kind==='times11'){
    const k = rand(13,89);
    return {cat:'shortcuts',
      q:{en:`Work out <b>11 × ${k}</b>. Tip: 11 is 10 + 1.`, fr:`Calculez <b>11 × ${k}</b>. Astuce : 11, c’est 10 + 1.`},
      a:{en:`11 × ${k} = (10 × ${k}) + ${k} = ${10*k} + ${k} = <b>${grp(11*k,'en')}</b>.`,
         fr:`11 × ${k} = (10 × ${k}) + ${k} = ${10*k} + ${k} = <b>${grp(11*k,'fr')}</b>.`}};
  }
  if(kind==='times12'){
    const k = rand(12,45);
    return {cat:'shortcuts',
      q:{en:`Work out <b>12 × ${k}</b>. Tip: 12 is 10 + 2.`, fr:`Calculez <b>12 × ${k}</b>. Astuce : 12, c’est 10 + 2.`},
      a:{en:`12 × ${k} = (10 × ${k}) + (2 × ${k}) = ${10*k} + ${2*k} = <b>${grp(12*k,'en')}</b>.`,
         fr:`12 × ${k} = (10 × ${k}) + (2 × ${k}) = ${10*k} + ${2*k} = <b>${grp(12*k,'fr')}</b>.`}};
  }
  if(kind==='times5'){
    const k = level==='gentle'?rand(6,24):rand(24,88);
    return {cat:'shortcuts',
      q:{en:`Work out <b>${k} × 5</b>. Tip: multiply by 10, then take half.`,
         fr:`Calculez <b>${k} × 5</b>. Astuce : multipliez par 10, puis prenez la moitié.`},
      a:{en:`${k} × 10 = ${10*k}; half of that is <b>${5*k}</b>.`,
         fr:`${k} × 10 = ${10*k}; la moitié fait <b>${5*k}</b>.`}};
  }
  if(kind==='times4'){
    const k = level==='gentle'?rand(6,19):rand(14,39);
    return {cat:'shortcuts',
      q:{en:`Work out <b>${k} × 4</b>. Tip: double it, then double again.`,
         fr:`Calculez <b>${k} × 4</b>. Astuce : doublez, puis doublez encore.`},
      a:{en:`Double ${k} is ${2*k}; double again is <b>${4*k}</b>.`,
         fr:`Le double de ${k} est ${2*k}; encore doublé, cela fait <b>${4*k}</b>.`}};
  }
  if(kind==='times50'){
    const a1 = choice([16,18,22,24,26,14]);
    return {cat:'shortcuts',
      q:{en:`Work out <b>50 × ${a1}</b>. Tip: 50 is half of 100.`,
         fr:`Calculez <b>50 × ${a1}</b>. Astuce : 50, c’est la moitié de 100.`},
      a:{en:`50 × ${a1} = (100 × ${a1}) ÷ 2 = ${grp(100*a1,'en')} ÷ 2 = <b>${grp(50*a1,'en')}</b>.`,
         fr:`50 × ${a1} = (100 × ${a1}) ÷ 2 = ${grp(100*a1,'fr')} ÷ 2 = <b>${grp(50*a1,'fr')}</b>.`}};
  }
  if(kind==='times15'){
    const k = choice([12,14,16,18,22,24,26]);
    const half=k*10/2;
    return {cat:'shortcuts',
      q:{en:`Work out <b>${k} × 15</b>. Tip: 15 is 10 + half of 10.`,
         fr:`Calculez <b>${k} × 15</b>. Astuce : 15, c’est 10 plus la moitié de 10.`},
      a:{en:`${k} × 10 = ${10*k}; half of that is ${half}; together <b>${15*k}</b>.`,
         fr:`${k} × 10 = ${10*k}; la moitié fait ${half}; ensemble <b>${15*k}</b>.`}};
  }
  if(kind==='sq5'){
    const t = choice([25,35,45,55,65,75,85]);
    const d = (t-5)/10; const front = d*(d+1);
    return {cat:'shortcuts',
      q:{en:`Square <b>${t}</b> (that is, ${t} × ${t}). Tip: for a number ending in 5, multiply the tens digit by the next number up, then write 25 on the end.`,
         fr:`Élevez <b>${t}</b> au carré (soit ${t} × ${t}). Astuce : pour un nombre finissant par 5, multipliez le chiffre des dizaines par le suivant, puis ajoutez 25 à la fin.`},
      a:{en:`${d} × ${d+1} = ${front}, then attach 25: <b>${grp(t*t,'en')}</b>.`,
         fr:`${d} × ${d+1} = ${front}, puis on ajoute 25 : <b>${grp(t*t,'fr')}</b>.`}};
  }
  if(kind==='diffsq'){
    const base = choice([48,52,47,53,96,104,98]);
    const round = Math.round(base/10)*10; const a=Math.abs(base-round);
    return {cat:'shortcuts',
      q:{en:`Square <b>${base}</b> using a nearby round number. Tip: ${base} = ${round} ${base<round?'−':'+'} ${a}, and (x ${base<round?'−':'+'} ${a})² is close to ${round} × ${base<round?base+ (round-base)*0:'' } …`,
         fr:`Élevez <b>${base}</b> au carré en vous aidant d’un nombre rond voisin. Astuce : ${base} = ${round} ${base<round?'−':'+'} ${a}.`},
      a:{en:`${base}² = (${round-a}) × (${round+a}) + ${a}² = ${(round-a)*(round+a)} + ${a*a} = <b>${grp(base*base,'en')}</b>.`,
         fr:`${base}² = (${round-a}) × (${round+a}) + ${a}² = ${(round-a)*(round+a)} + ${a*a} = <b>${grp(base*base,'fr')}</b>.`}};
  }
  // sum 1..n via pairs
  const n = level==='gentle'?choice([10,10,20]):level==='standard'?choice([20,50,100]):choice([50,100,60,80]);
  const res=n*(n+1)/2, pairs=n/2;
  return {cat:'shortcuts',
    q:{en:`Add up every whole number from 1 to ${n}. Tip: pair the ends — 1 + ${n}, 2 + ${n-1}, and so on.`,
       fr:`Additionnez tous les nombres entiers de 1 à ${n}. Astuce : associez les extrémités — 1 + ${n}, 2 + ${n-1}, et ainsi de suite.`},
    a:{en:`Each pair makes ${n+1}, and there are ${pairs} pairs: ${pairs} × ${n+1} = <b>${grp(res,'en')}</b>.`,
       fr:`Chaque paire donne ${n+1}, et il y a ${pairs} paires : ${pairs} × ${n+1} = <b>${grp(res,'fr')}</b>.`}};
}

/* ============================================================
   3. Number patterns ("find the rule")
   ============================================================ */
function genPatterns(level){
  const kinds = level==='gentle'
    ? ['add','count','double','subtract','halving']
    : level==='standard'
      ? ['double','squares','fib','triangular','add','geometric','alt','subtract']
      : ['squares','fib','triangular','geometric','alt','cubes','primes','powers2'];
  const kind = choice(kinds);
  let seq=[], next, ruleEn, ruleFr;

  if(kind==='add'){
    const start=rand(1,6), step=rand(2,6);
    for(let i=0;i<5;i++) seq.push(start+i*step);
    next=start+5*step; ruleEn=`add ${step} each time`; ruleFr=`on ajoute ${step} à chaque fois`;
  } else if(kind==='count'){
    const start=rand(2,5);
    for(let i=0;i<5;i++) seq.push(start*(i+1));
    next=start*6; ruleEn=`count up in ${start}s`; ruleFr=`on compte par bonds de ${start}`;
  } else if(kind==='subtract'){
    const step=rand(3,8), start=step*7+rand(1,5);
    for(let i=0;i<5;i++) seq.push(start-i*step);
    next=start-5*step; ruleEn=`subtract ${step} each time`; ruleFr=`on soustrait ${step} à chaque fois`;
  } else if(kind==='double'){
    const start=rand(2,5);
    seq=[start]; for(let i=1;i<5;i++) seq.push(seq[i-1]*2);
    next=seq[4]*2; ruleEn=`double each time`; ruleFr=`on double à chaque fois`;
  } else if(kind==='halving'){
    const start=choice([96,80,64,48,160]);
    seq=[start]; for(let i=1;i<4;i++) seq.push(seq[i-1]/2);
    next=seq[3]/2; ruleEn=`halve each time`; ruleFr=`on divise par deux à chaque fois`;
  } else if(kind==='squares'){
    for(let i=1;i<=5;i++) seq.push(i*i);
    next=36; ruleEn=`the square numbers (1×1, 2×2, 3×3 …)`; ruleFr=`les carrés (1×1, 2×2, 3×3 …)`;
  } else if(kind==='cubes'){
    for(let i=1;i<=4;i++) seq.push(i*i*i);
    next=125; ruleEn=`the cube numbers (1×1×1, 2×2×2, 3×3×3 …)`; ruleFr=`les cubes (1×1×1, 2×2×2, 3×3×3 …)`;
  } else if(kind==='primes'){
    seq=[2,3,5,7,11]; next=13;
    ruleEn=`the prime numbers — whole numbers with no divisors but 1 and themselves`;
    ruleFr=`les nombres premiers — les entiers divisibles seulement par 1 et par eux-mêmes`;
  } else if(kind==='powers2'){
    seq=[1,2,4,8,16]; next=32;
    ruleEn=`the powers of two — double each time`; ruleFr=`les puissances de deux — on double à chaque fois`;
  } else if(kind==='triangular'){
    let t=0; for(let i=1;i<=5;i++){t+=i;seq.push(t);}
    next=seq[4]+6; ruleEn=`the triangular numbers — add 1, then 2, then 3 …`; ruleFr=`les nombres triangulaires — on ajoute 1, puis 2, puis 3 …`;
  } else if(kind==='fib'){
    const a=rand(1,3), b=rand(a+1,a+4);
    seq=[a,b]; for(let i=2;i<6;i++) seq.push(seq[i-1]+seq[i-2]);
    next=seq[5]; seq=seq.slice(0,5);
    ruleEn=`each number is the sum of the two before it (Fibonacci style)`; ruleFr=`chaque nombre est la somme des deux précédents (à la Fibonacci)`;
  } else if(kind==='geometric'){
    const start=rand(2,4), r=3;
    seq=[start]; for(let i=1;i<5;i++) seq.push(seq[i-1]*r);
    next=seq[4]*r; ruleEn=`multiply by 3 each time`; ruleFr=`on multiplie par 3 à chaque fois`;
  } else { // alt
    const start=rand(1,4), a=rand(2,4), b=rand(5,7);
    seq=[start]; for(let i=1;i<5;i++) seq.push(seq[i-1]+(i%2? a : b));
    next=seq[4]+(5%2? a : b);
    ruleEn=`add ${a}, then ${b}, over and over`; ruleFr=`on ajoute ${a}, puis ${b}, en alternance`;
  }

  const L='en';
  const shown = seq.map(v=>grp(v,'en')).join(', ')+', ___';
  const shownFr = seq.map(v=>grp(v,'fr')).join(', ')+', ___';
  return {cat:'patterns',
    q:{en:`Look at this sequence: <b>${shown}</b><span class="work">What number comes next, and what is the rule?</span>`,
       fr:`Observez cette suite : <b>${shownFr}</b><span class="work">Quel nombre vient ensuite, et quelle est la règle?</span>`},
    a:{en:`Next is <b>${grp(next,'en')}</b> — the rule is: ${ruleEn}.`,
       fr:`Le suivant est <b>${grp(next,'fr')}</b> — la règle : ${ruleFr}.`}};
}

/* ============================================================
   4. Adult word problems
   ============================================================ */
function genWords(level){
  const kinds = level==='gentle'
    ? ['time','between','garden','convert','percent']
    : ['time','between','recipe','garden','speed','convert','percent','age'];
  const kind = choice(kinds);

  if(kind==='time'){
    let startMin, dur;
    if(level==='gentle'){ startMin = rand(8,10)*60 + choice([0,30]); dur = choice([30,45,60,90]); }
    else if(level==='standard'){ startMin = rand(8,17)*60 + choice([0,15,30,45]); dur = choice([75,90,105,120,150]); }
    else { startMin = rand(7,20)*60 + choice([10,20,25,40,50]); dur = choice([95,130,145,175,200]); }
    const end = startMin+dur;
    return {cat:'words',
      q:{en:`A medical appointment starts at ${fmtTime(startMin,'en')} and lasts ${durText(dur,'en')}. At what time does it finish?`,
         fr:`Un rendez-vous médical commence à ${fmtTime(startMin,'fr')} et dure ${durText(dur,'fr')}. À quelle heure se termine-t-il?`},
      a:{en:`It finishes at <b>${fmtTime(end,'en')}</b>.`, fr:`Il se termine à <b>${fmtTime(end,'fr')}</b>.`}};
  }

  if(kind==='between'){
    const startMin = rand(7,13)*60 + choice([5,10,20,25,40,50]);
    const dur = level==='gentle'?choice([40,50,60,75]):choice([65,85,95,110,125]);
    const end = startMin+dur;
    return {cat:'words',
      q:{en:`You leave home at ${fmtTime(startMin,'en')} and arrive at ${fmtTime(end,'en')}. How long did the journey take?`,
         fr:`Vous quittez la maison à ${fmtTime(startMin,'fr')} et arrivez à ${fmtTime(end,'fr')}. Combien de temps a duré le trajet?`},
      a:{en:`<b>${durText(dur,'en')}</b>.`, fr:`<b>${durText(dur,'fr')}</b>.`}};
  }

  if(kind==='recipe'){
    const ingEn = choice([['flour','cups'],['sugar','cups'],['milk','cups'],['butter','tablespoons']]);
    const ingFr = {flour:'de farine',sugar:'de sucre',milk:'de lait',butter:'de beurre'}[ingEn[0]];
    const nameFr = {flour:'farine',sugar:'sucre',milk:'lait',butter:'beurre'}[ingEn[0]];
    const unitEn = ingEn[1], unitFr = ingEn[0]==='butter'?'cuillères à soupe':'tasses';
    let baseServes, want, baseAmt;
    if(level==='standard'){ baseServes=4; want=6; baseAmt=choice([2,3,1.5]); }
    else { baseServes=6; want=choice([4,9,15]); baseAmt=choice([3,4,2.5]); }
    const scaled = +(baseAmt*want/baseServes).toFixed(2);
    return {cat:'words',
      q:{en:`A recipe for ${baseServes} people uses ${num(baseAmt,'en')} ${unitEn} of ${ingEn[0]}. How much ${ingEn[0]} do you need to serve ${want} people?`,
         fr:`Une recette pour ${baseServes} personnes utilise ${num(baseAmt,'fr')} ${unitFr} ${ingFr}. Quelle quantité de ${nameFr} faut-il pour servir ${want} personnes?`},
      a:{en:`Scale by ${want}/${baseServes}: ${num(baseAmt,'en')} × ${want} ÷ ${baseServes} = <b>${num(scaled,'en')} ${unitEn}</b>.`,
         fr:`On multiplie par ${want}/${baseServes} : ${num(baseAmt,'fr')} × ${want} ÷ ${baseServes} = <b>${num(scaled,'fr')} ${unitFr}</b>.`}};
  }

  if(kind==='garden'){
    let L,W;
    if(level==='gentle'){ L=rand(3,6); W=rand(2,4); }
    else if(level==='standard'){ L=rand(5,12); W=rand(3,8); }
    else { L=rand(8,18); W=rand(4,13); }
    const area=L*W, per=2*(L+W);
    const askBoth = level!=='gentle';
    return {cat:'words',
      q:{en:`A rectangular vegetable garden measures ${L} m by ${W} m. What is its area${askBoth?', and how much fencing would go all the way around it':''}?`,
         fr:`Un potager rectangulaire mesure ${L} m sur ${W} m. Quelle est son aire${askBoth?', et quelle longueur de clôture en ferait tout le tour':''}?`},
      a:{en:`Area = ${L} × ${W} = <b>${area} m²</b>.${askBoth?` Perimeter = 2 × (${L} + ${W}) = <b>${per} m</b> of fencing.`:''}`,
         fr:`Aire = ${L} × ${W} = <b>${area} m²</b>.${askBoth?` Périmètre = 2 × (${L} + ${W}) = <b>${per} m</b> de clôture.`:''}`}};
  }

  if(kind==='speed'){
    if(Math.random()<0.5){
      const S=choice([60,70,80,90]), t=choice([2,3,4]); const D=S*t;
      return {cat:'words',
        q:{en:`A car travels ${grp(D,'en')} km at a steady ${S} km/h. How long does the trip take?`,
           fr:`Une voiture parcourt ${grp(D,'fr')} km à une vitesse constante de ${S} km/h. Combien de temps dure le trajet?`},
        a:{en:`${grp(D,'en')} ÷ ${S} = <b>${t} hours</b>.`, fr:`${grp(D,'fr')} ÷ ${S} = <b>${t} heures</b>.`}};
    }
    const t=choice([30,40,45,90]), D=choice([2,3,4,6]); const perHr=+(D*60/t).toFixed(1);
    return {cat:'words',
      q:{en:`You walk ${D} km in ${t} minutes. At that pace, how far would you walk in one hour?`,
         fr:`Vous marchez ${D} km en ${t} minutes. À ce rythme, quelle distance parcourriez-vous en une heure?`},
      a:{en:`In 60 minutes: ${D} × 60 ÷ ${t} = <b>${num(perHr,'en')} km</b>.`,
         fr:`En 60 minutes : ${D} × 60 ÷ ${t} = <b>${num(perHr,'fr')} km</b>.`}};
  }

  if(kind==='convert'){
    const which = choice(['ml','km','kg','min']);
    if(which==='ml'){ const cups=choice([2,3,4]); const ml=cups*250;
      return {cat:'words',
        q:{en:`A recipe calls for ${ml} ml of milk. About how many cups is that, if one cup is 250 ml?`,
           fr:`Une recette demande ${ml} ml de lait. Cela fait combien de tasses, si une tasse vaut 250 ml?`},
        a:{en:`${ml} ÷ 250 = <b>${cups} cups</b>.`, fr:`${ml} ÷ 250 = <b>${cups} tasses</b>.`}}; }
    if(which==='km'){ const km=choice([1.5,2.4,3.2,4.5]);
      return {cat:'words',
        q:{en:`A walking path is ${num(km,'en')} km long. How many metres is that?`,
           fr:`Un sentier fait ${num(km,'fr')} km de long. Combien de mètres cela représente-t-il?`},
        a:{en:`${num(km,'en')} × 1000 = <b>${grp(km*1000,'en')} m</b>.`, fr:`${num(km,'fr')} × 1000 = <b>${grp(km*1000,'fr')} m</b>.`}}; }
    if(which==='kg'){ const kg=choice([1.5,2.5,3.2,0.75]);
      return {cat:'words',
        q:{en:`A parcel weighs ${num(kg,'en')} kg. How many grams is that?`,
           fr:`Un colis pèse ${num(kg,'fr')} kg. Combien de grammes cela fait-il?`},
        a:{en:`${num(kg,'en')} × 1000 = <b>${grp(kg*1000,'en')} g</b>.`, fr:`${num(kg,'fr')} × 1000 = <b>${grp(kg*1000,'fr')} g</b>.`}}; }
    const mins=choice([90,135,145,200,75]);
    return {cat:'words',
      q:{en:`A concert lasts ${mins} minutes. How many hours and minutes is that?`,
         fr:`Un concert dure ${mins} minutes. Cela fait combien d’heures et de minutes?`},
      a:{en:`${mins} minutes = <b>${Math.floor(mins/60)} h ${pad2(mins%60)} min</b>.`,
         fr:`${mins} minutes = <b>${Math.floor(mins/60)} h ${pad2(mins%60)} min</b>.`}};
  }

  // age (ratio) — kept relationship-neutral in phrasing
  const k=choice([2,3,4]); const g=rand(9,16); const S=g*(k+1);
  return {cat:'words',
    q:{en:`A grandparent is ${k} times as old as their grandchild. Together their ages add up to ${S}. How old is each of them?`,
       fr:`Un grand-parent a ${k} fois l’âge de son petit-enfant. Ensemble, leurs âges totalisent ${S}. Quel âge a chacun?`},
    a:{en:`The grandchild is ${g} (since ${g} × ${k+1} = ${S}), and the grandparent is <b>${g*k}</b>.`,
       fr:`Le petit-enfant a ${g} ans (car ${g} × ${k+1} = ${S}), et le grand-parent a <b>${g*k}</b> ans.`}};
}

function msqTable(grid){
  let h='<table class="msq"><tbody>';
  for(let r=0;r<3;r++){ h+='<tr>'; for(let c=0;c<3;c++){ const v=grid[r][c]; h+= v==null?'<td class="blank">?</td>':`<td>${v}</td>`; } h+='</tr>'; }
  return h+'</tbody></table>';
}
// All eight orientations of the order-3 magic square (every line sums to 15)

  {sol:[[4,3,8],[9,5,1],[2,7,6]], blanks:[[0,0],[1,0],[2,2],[0,2]]},

  {sol:[[6,1,8],[7,5,3],[2,9,4]], blanks:[[0,1],[1,0],[1,2],[2,1]]},
  {sol:[[8,3,4],[1,5,9],[6,7,2]], blanks:[[1,0],[1,2],[0,2],[2,0]]},
  {sol:[[2,7,6],[9,5,1],[4,3,8]], blanks:[[0,1],[1,1],[2,1]]},

  {q:{en:`If 2 cats can catch 2 mice in 2 minutes, how many cats are needed to catch 100 mice in 100 minutes?`,

  {q:{en:`You have a 5-litre jug and a 3-litre jug and a tap. How can you measure out exactly 4 litres?`,

   a:{en:`Fill the 5 L and pour into the 3 L (2 L left in the big jug). Empty the 3 L, pour the 2 L into it. Refill the 5 L and top up the 3 L — that needs 1 L, leaving <b>exactly 4 L</b> in the big jug.`,

   a:{en:`Take the goat over; return alone. Take the wolf over; bring the goat back. Take the cabbage over; return alone. Finally take the goat over. <b>All safe.</b>`,
      fr:`Emmenez la chèvre; revenez seul. Emmenez le loup; ramenez la chèvre. Emmenez le chou; revenez seul. Emmenez enfin la chèvre. <b>Tous sains et saufs.</b>`}}
];
let _magicIdx=[], _hsIdx=[], _teaseIdx=[];
function genLogic(level){
  const kinds = level==='gentle' ? ['handshake','dayweek','magic'] : ['magic','handshake','dayweek','teaser'];
  const kind = choice(kinds);

  if(kind==='magic'){
    if(_magicIdx.length===0) _magicIdx = shuffle(MAGIC.map((_,i)=>i));
    const m = MAGIC[_magicIdx.pop()];
    const grid = m.sol.map(r=>r.slice());
    m.blanks.forEach(([r,c])=>{grid[r][c]=null;});
    return {cat:'logic',
      q:{en:`Fill in the missing numbers so that each row, each column, and both diagonals add up to 15. Use the digits 1–9, each exactly once.`+msqTable(grid),
         fr:`Complétez les cases manquantes pour que chaque ligne, chaque colonne et les deux diagonales totalisent 15. Utilisez les chiffres de 1 à 9, chacun une seule fois.`+msqTable(grid)},
      a:{en:`The completed square:`+msqTable(m.sol), fr:`Le carré complété :`+msqTable(m.sol)}};
  }
  if(kind==='handshake'){
    if(_hsIdx.length===0) _hsIdx = shuffle(HANDSHAKE.map((_,i)=>i));
    const n = HANDSHAKE[_hsIdx.pop()].n; const res=n*(n-1)/2;
    return {cat:'logic',
      q:{en:`${n} people meet at a gathering, and every person shakes hands once with every other person. How many handshakes take place in all?`,
         fr:`${n} personnes se rencontrent lors d’une réunion, et chacune serre la main une seule fois à chacune des autres. Combien de poignées de main ont lieu en tout?`},
      a:{en:`Each of the ${n} people shakes ${n-1} hands, which counts every handshake twice: ${n} × ${n-1} ÷ 2 = <b>${res}</b>.`,
         fr:`Chacune des ${n} personnes serre ${n-1} mains, ce qui compte chaque poignée deux fois : ${n} × ${n-1} ÷ 2 = <b>${res}</b>.`}};
  }
  if(kind==='dayweek'){
    const start=rand(0,6), N=choice([10,20,30,45,50,100]); const res=(start+N)%7; const r=N%7;
    return {cat:'logic',
      q:{en:`If today is ${DAYS.en[start]}, what day of the week will it be in ${N} days?`,
         fr:`Si aujourd’hui est ${DAYS.fr[start]}, quel jour de la semaine serons-nous dans ${N} jours?`},
      a:{en:`${N} ÷ 7 leaves ${r}; counting ${r} day${r===1?'':'s'} on from ${DAYS.en[start]} gives <b>${DAYS.en[res]}</b>.`,
         fr:`${N} ÷ 7 laisse ${r}; en comptant ${r} jour${r===1?'':'s'} après ${DAYS.fr[start]}, on obtient <b>${DAYS.fr[res]}</b>.`}};
  }
  // teaser
  if(_teaseIdx.length===0) _teaseIdx = shuffle(TEASERS.map((_,i)=>i));
  const t = TEASERS[_teaseIdx.pop()];
  return {cat:'logic', q:t.q, a:t.a};
}

function genGeometry(level){
  const kinds = level==='gentle'
    ? ['rect','square','triAngles','straight','box']
    : level==='standard'
      ? ['rect','triArea','triAngles','straight','complement','circleC','box']
      : ['triArea','circleC','circleA','pythag','box','point','triAngles'];
  const kind = choice(kinds);

  if(kind==='rect'){
    const Lg=rand(4,15), Wd=rand(3,10);
    return {cat:'geometry',
      q:{en:`A rectangle is ${Lg} cm long and ${Wd} cm wide. Find its area and its perimeter.`,
         fr:`Un rectangle mesure ${Lg} cm de long et ${Wd} cm de large. Trouvez son aire et son périmètre.`},
      a:{en:`Area = ${Lg} × ${Wd} = <b>${Lg*Wd} cm²</b>. Perimeter = 2 × (${Lg} + ${Wd}) = <b>${2*(Lg+Wd)} cm</b>.`,
         fr:`Aire = ${Lg} × ${Wd} = <b>${Lg*Wd} cm²</b>. Périmètre = 2 × (${Lg} + ${Wd}) = <b>${2*(Lg+Wd)} cm</b>.`}};
  }
  if(kind==='square'){
    const s=rand(4,14);
    return {cat:'geometry',
      q:{en:`A square has sides of ${s} cm. Find its area and its perimeter.`,
         fr:`Un carré a des côtés de ${s} cm. Trouvez son aire et son périmètre.`},
      a:{en:`Area = ${s} × ${s} = <b>${s*s} cm²</b>. Perimeter = 4 × ${s} = <b>${4*s} cm</b>.`,
         fr:`Aire = ${s} × ${s} = <b>${s*s} cm²</b>. Périmètre = 4 × ${s} = <b>${4*s} cm</b>.`}};
  }
  if(kind==='triArea'){
    const b=choice([4,6,8,10,12,14]), h=choice([3,5,6,7,9,11]);
    return {cat:'geometry',
      q:{en:`A triangle has a base of ${b} cm and a height of ${h} cm. What is its area?`,
         fr:`Un triangle a une base de ${b} cm et une hauteur de ${h} cm. Quelle est son aire?`},
      a:{en:`Area = ½ × ${b} × ${h} = <b>${num(b*h/2,'en')} cm²</b>.`,
         fr:`Aire = ½ × ${b} × ${h} = <b>${num(b*h/2,'fr')} cm²</b>.`}};
  }
  if(kind==='triAngles'){
    let a1=rand(40,80), a2=rand(40,80); while(a1+a2>160){a1=rand(40,80);a2=rand(40,80);}
    return {cat:'geometry',
      q:{en:`Two angles of a triangle measure ${a1}° and ${a2}°. What is the third angle?`,
         fr:`Deux angles d’un triangle mesurent ${a1}° et ${a2}°. Quel est le troisième angle?`},
      a:{en:`The three angles add to 180°: 180 − ${a1} − ${a2} = <b>${180-a1-a2}°</b>.`,
         fr:`La somme des trois angles fait 180° : 180 − ${a1} − ${a2} = <b>${180-a1-a2}°</b>.`}};
  }
  if(kind==='straight'){
    const one=rand(30,150);
    return {cat:'geometry',
      q:{en:`Two angles sit together on a straight line. One measures ${one}°. What is the other?`,
         fr:`Deux angles se trouvent ensemble sur une ligne droite. L’un mesure ${one}°. Quel est l’autre?`},
      a:{en:`Angles on a straight line add to 180°: 180 − ${one} = <b>${180-one}°</b>.`,
         fr:`Les angles sur une ligne droite totalisent 180° : 180 − ${one} = <b>${180-one}°</b>.`}};
  }
  if(kind==='complement'){
    const one=rand(20,70);
    return {cat:'geometry',
      q:{en:`Two angles together form a right angle. One measures ${one}°. What is the other?`,
         fr:`Deux angles forment ensemble un angle droit. L’un mesure ${one}°. Quel est l’autre?`},
      a:{en:`A right angle is 90°: 90 − ${one} = <b>${90-one}°</b>.`,
         fr:`Un angle droit vaut 90° : 90 − ${one} = <b>${90-one}°</b>.`}};
  }
  if(kind==='point'){
    let a1=rand(60,150), a2=rand(60,150); while(a1+a2>300){a1=rand(60,150);a2=rand(60,150);}
    return {cat:'geometry',
      q:{en:`Three angles meet at a point. Two of them measure ${a1}° and ${a2}°. What is the third?`,
         fr:`Trois angles se rejoignent en un point. Deux d’entre eux mesurent ${a1}° et ${a2}°. Quel est le troisième?`},
      a:{en:`Angles around a point add to 360°: 360 − ${a1} − ${a2} = <b>${360-a1-a2}°</b>.`,
         fr:`Les angles autour d’un point totalisent 360° : 360 − ${a1} − ${a2} = <b>${360-a1-a2}°</b>.`}};
  }
  if(kind==='circleC'){
    const r=choice([3,4,5,6,7,10]); const C=+(2*3.14*r).toFixed(2);
    return {cat:'geometry',
      q:{en:`A circle has a radius of ${r} cm. What is its circumference? (Use π ≈ 3.14.)`,
         fr:`Un cercle a un rayon de ${r} cm. Quelle est sa circonférence? (Prenez π ≈ 3,14.)`},
      a:{en:`Circumference = 2 × 3.14 × ${r} = <b>${num(C,'en')} cm</b>.`,
         fr:`Circonférence = 2 × 3,14 × ${r} = <b>${num(C,'fr')} cm</b>.`}};
  }
  if(kind==='circleA'){
    const r=choice([2,3,4,5,6,10]); const A=+(3.14*r*r).toFixed(2);
    return {cat:'geometry',
      q:{en:`A circle has a radius of ${r} cm. What is its area? (Use π ≈ 3.14.)`,
         fr:`Un cercle a un rayon de ${r} cm. Quelle est son aire? (Prenez π ≈ 3,14.)`},
      a:{en:`Area = 3.14 × ${r}² = 3.14 × ${r*r} = <b>${num(A,'en')} cm²</b>.`,
         fr:`Aire = 3,14 × ${r}² = 3,14 × ${r*r} = <b>${num(A,'fr')} cm²</b>.`}};
  }
  if(kind==='pythag'){
    const t=choice([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]]);
    return {cat:'geometry',
      q:{en:`A right-angled triangle has its two shorter sides measuring ${t[0]} cm and ${t[1]} cm. How long is the longest side (the hypotenuse)?`,
         fr:`Un triangle rectangle a ses deux côtés les plus courts qui mesurent ${t[0]} cm et ${t[1]} cm. Quelle est la longueur du plus long côté (l’hypoténuse)?`},
      a:{en:`${t[0]}² + ${t[1]}² = ${t[0]*t[0]} + ${t[1]*t[1]} = ${t[0]*t[0]+t[1]*t[1]}, and its square root is <b>${t[2]} cm</b>.`,
         fr:`${t[0]}² + ${t[1]}² = ${t[0]*t[0]} + ${t[1]*t[1]} = ${t[0]*t[0]+t[1]*t[1]}, et sa racine carrée est <b>${t[2]} cm</b>.`}};
  }
  // box volume
  const l=rand(2,8), w=rand(2,6), h=rand(2,5);
  return {cat:'geometry',
    q:{en:`A rectangular box measures ${l} cm by ${w} cm by ${h} cm. What is its volume?`,
       fr:`Une boîte rectangulaire mesure ${l} cm sur ${w} cm sur ${h} cm. Quel est son volume?`},
    a:{en:`Volume = ${l} × ${w} × ${h} = <b>${l*w*h} cm³</b>.`,
       fr:`Volume = ${l} × ${w} × ${h} = <b>${l*w*h} cm³</b>.`}};
}

/* ============================================================
   8. Algebra
   ============================================================ */
function genAlgebra(level){
  const kinds = level==='gentle'
    ? ['add','sub','mul','subst','word']
    : level==='standard'
      ? ['twostep','subst','nth','word','simplify','mul']
      : ['twostep','bothsides','nth','simplify','word','subst'];
  const kind = choice(kinds);

  if(kind==='add'){
    const x=rand(2,20), a=rand(2,20), b=x+a;
    return {cat:'algebra',
      q:{en:`Solve for x:  <b>x + ${a} = ${b}</b>`, fr:`Résolvez pour x :  <b>x + ${a} = ${b}</b>`},
      a:{en:`Subtract ${a} from both sides: x = ${b} − ${a} = <b>${x}</b>.`,
         fr:`Soustrayez ${a} des deux côtés : x = ${b} − ${a} = <b>${x}</b>.`}};
  }
  if(kind==='sub'){
    const x=rand(6,30), a=rand(2,9), b=x-a;
    return {cat:'algebra',
      q:{en:`Solve for x:  <b>x − ${a} = ${b}</b>`, fr:`Résolvez pour x :  <b>x − ${a} = ${b}</b>`},
      a:{en:`Add ${a} to both sides: x = ${b} + ${a} = <b>${x}</b>.`,
         fr:`Ajoutez ${a} aux deux côtés : x = ${b} + ${a} = <b>${x}</b>.`}};
  }
  if(kind==='mul'){
    const a=rand(2,9), x=rand(2,12), b=a*x;
    return {cat:'algebra',
      q:{en:`Solve for x:  <b>${a}x = ${b}</b>`, fr:`Résolvez pour x :  <b>${a}x = ${b}</b>`},
      a:{en:`Divide both sides by ${a}: x = ${b} ÷ ${a} = <b>${x}</b>.`,
         fr:`Divisez les deux côtés par ${a} : x = ${b} ÷ ${a} = <b>${x}</b>.`}};
  }
  if(kind==='twostep'){
    const a=rand(2,6), x=rand(2,10), b=rand(1,12), c=a*x+b;
    return {cat:'algebra',
      q:{en:`Solve for x:  <b>${a}x + ${b} = ${c}</b>`, fr:`Résolvez pour x :  <b>${a}x + ${b} = ${c}</b>`},
      a:{en:`Subtract ${b}: ${a}x = ${c-b}. Divide by ${a}: x = <b>${x}</b>.`,
         fr:`Soustrayez ${b} : ${a}x = ${c-b}. Divisez par ${a} : x = <b>${x}</b>.`}};
  }
  if(kind==='bothsides'){
    const c=rand(1,3), a=c+rand(2,5), x=rand(2,9), b=rand(1,10), d=(a-c)*x+b;
    return {cat:'algebra',
      q:{en:`Solve for x:  <b>${a}x + ${b} = ${c}x + ${d}</b>`, fr:`Résolvez pour x :  <b>${a}x + ${b} = ${c}x + ${d}</b>`},
      a:{en:`Take ${c}x from both sides: ${a-c}x + ${b} = ${d}. Then ${a-c}x = ${d-b}, so x = <b>${x}</b>.`,
         fr:`Retirez ${c}x des deux côtés : ${a-c}x + ${b} = ${d}. Puis ${a-c}x = ${d-b}, donc x = <b>${x}</b>.`}};
  }
  if(kind==='subst'){
    const v=rand(2,9), a=rand(2,6), b=rand(1,12);
    return {cat:'algebra',
      q:{en:`If x = ${v}, what is the value of  <b>${a}x + ${b}</b>?`, fr:`Si x = ${v}, quelle est la valeur de  <b>${a}x + ${b}</b>?`},
      a:{en:`${a} × ${v} + ${b} = ${a*v} + ${b} = <b>${a*v+b}</b>.`,
         fr:`${a} × ${v} + ${b} = ${a*v} + ${b} = <b>${a*v+b}</b>.`}};
  }
  if(kind==='nth'){
    const s=rand(1,6), d=rand(2,6), n=choice([8,10,12,20]);
    const seq=[s,s+d,s+2*d,s+3*d].join(', '); const val=s+(n-1)*d;
    return {cat:'algebra',
      q:{en:`A sequence begins ${seq}, … and goes up by ${d} each time. Using the rule “first term + (position − 1) × step”, what is the ${n}th term?`,
         fr:`Une suite commence par ${seq}, … et augmente de ${d} à chaque fois. Avec la règle « premier terme + (position − 1) × pas », quel est le ${n}e terme?`},
      a:{en:`${s} + (${n} − 1) × ${d} = ${s} + ${(n-1)*d} = <b>${val}</b>.`,
         fr:`${s} + (${n} − 1) × ${d} = ${s} + ${(n-1)*d} = <b>${val}</b>.`}};
  }
  if(kind==='simplify'){
    const a=rand(2,6), cc=rand(2,6), b=rand(1,9), dd=rand(1,9);
    return {cat:'algebra',
      q:{en:`Simplify by collecting like terms:  <b>${a}x + ${b} + ${cc}x + ${dd}</b>`,
         fr:`Simplifiez en regroupant les termes semblables :  <b>${a}x + ${b} + ${cc}x + ${dd}</b>`},
      a:{en:`(${a} + ${cc})x + (${b} + ${dd}) = <b>${a+cc}x + ${b+dd}</b>.`,
         fr:`(${a} + ${cc})x + (${b} + ${dd}) = <b>${a+cc}x + ${b+dd}</b>.`}};
  }
  // word → equation
  const x=rand(2,12), a=rand(2,6), b=rand(1,15), c=a*x+b;
  return {cat:'algebra',
    q:{en:`I think of a number, multiply it by ${a}, then add ${b}, and the result is ${c}. What number did I start with?`,
       fr:`Je pense à un nombre, je le multiplie par ${a}, puis j’ajoute ${b}, et le résultat est ${c}. Quel nombre ai-je choisi au départ?`},
    a:{en:`Work backwards: (${c} − ${b}) ÷ ${a} = ${c-b} ÷ ${a} = <b>${x}</b>.`,
       fr:`À rebours : (${c} − ${b}) ÷ ${a} = ${c-b} ÷ ${a} = <b>${x}</b>.`}};
}

/* ============================================================
   Set generation
   ============================================================ */
function generateSet(){
  const enabled = CATEGORIES.filter(c=>state.cats[c.id]);
  if(enabled.length===0){ state.problems=[]; return; }
  const target = rand(8,10);
  const out = [];
  let pool = shuffle(enabled.slice());
  let i=0, guard=0;
  while(out.length<target && guard<600){
    guard++;
    const cat = pool[i % pool.length];
    const p = cat.gen(state.level);
    const key = p.q.en.replace(/<[^>]+>/g,'').trim();
    if(!out.some(o=>o.q.en.replace(/<[^>]+>/g,'').trim()===key)){
      out.push(p); i++;
      if(i % pool.length===0) pool = shuffle(pool);
    }
  }
  state.problems = out;
}

/* ============================================================
   Rendering
   ============================================================ */
function catName(id){ return CATEGORIES.find(x=>x.id===id).name[state.lang]; }

function render(){
  const L = state.lang;
  document.documentElement.lang = L;
  document.getElementById('ui-title').innerHTML = UI.title[L];
  document.getElementById('ui-subtitle').textContent = UI.subtitle[L];
  document.getElementById('ui-mode-label').textContent = UI.modeLabel[L];
  document.getElementById('ui-level-label').textContent = UI.levelLabel[L];
  document.getElementById('ui-cats-label').textContent = UI.catsLabel[L];
  document.getElementById('ui-new').textContent = UI.newBtn[L];
  document.getElementById('ui-toggle').textContent = state.showAnswers?UI.hideBtn[L]:UI.showBtn[L];
  document.getElementById('ui-print').textContent = UI.printBtn[L];
  document.getElementById('ui-sheet-title').textContent = UI.sheetTitle[L];
  document.getElementById('ui-answerkey-title').textContent = UI.answerKey[L];
  document.getElementById('ui-foot').textContent = UI.foot[L];

  document.querySelectorAll('#modes button').forEach(b=>{
    const md=b.dataset.mode; b.textContent = UI.modes[md][L]; b.classList.toggle('active', md===state.mode);
  });
  document.querySelectorAll('#levels button').forEach(b=>{
    const lv=b.dataset.level; b.textContent = UI.levels[lv][L]; b.classList.toggle('active', lv===state.level);
  });
  document.getElementById('lang-en').classList.toggle('active', L==='en');
  document.getElementById('lang-fr').classList.toggle('active', L==='fr');

  renderPractice();

  const dateStr = UI.dateFmt[L](new Date());
  document.getElementById('ui-sheet-meta').textContent =
    state.problems.length ? UI.meta[L](state.problems.length, UI.levels[state.level][L], dateStr) : '';

  const ol = document.getElementById('problems');
  const key = document.getElementById('answerkey-list');
  ol.innerHTML=''; key.innerHTML='';

  if(state.problems.length===0){
    ol.innerHTML = `<div class="empty">${UI.empty[L]}</div>`;
    refreshCatLabels();
    return;
  }

  state.problems.forEach((p,idx)=>{
    const li=document.createElement('li');
    const revealed = p._revealed ? ' revealed' : '';
    if(p._revealed) li.classList.add('revealed');
    li.innerHTML =
      `<span class="p-tag">${catName(p.cat)}</span>`+
      `<div class="p-q">${p.q[L]}</div>`+
      `<div class="p-response"><span class="resp-label">${UI.yourAnswer[L]}</span>`+
        `<input class="answer-input" type="text" value="${esc(p._input||'')}" oninput="saveInput(${idx},this.value)" aria-label="${UI.yourAnswer[L]}"></div>`+
      `<button class="p-reveal no-print" onclick="revealOne(this,${idx})">${p._revealed?UI.revealHide[L]:UI.revealShow[L]}</button>`+
      `<div class="p-answer"><span class="a-label">${UI.aLabel[L]}</span>${p.a[L]}</div>`;
    ol.appendChild(li);

    const kli=document.createElement('li');
    kli.value = idx+1;
    kli.innerHTML = `<b>${catName(p.cat)}.</b> ${p.a[L]}`;
    key.appendChild(kli);
  });

  refreshCatLabels();
}

/* Practice mode: render the single current problem */
function renderPractice(){
  const L = state.lang;
  const prog = document.getElementById('practice-progress');
  const card = document.getElementById('practice-card');
  const tag  = document.getElementById('pr-tag');
  const q    = document.getElementById('pr-q');
  const resp = document.getElementById('pr-response');
  const ans  = document.getElementById('pr-answer');
  const acts = document.getElementById('pr-actions');

  if(!state.current){
    prog.textContent = '';
    tag.style.display = 'none';
    q.innerHTML = `<span style="color:var(--ink-soft)">${UI.practiceEmpty[L]}</span>`;
    resp.innerHTML = ''; ans.innerHTML = ''; acts.innerHTML = ''; card.classList.remove('revealed');
    return;
  }

  tag.style.display = '';
  prog.textContent = UI.progress[L](state.count);
  tag.textContent = catName(state.current.cat);
  q.innerHTML = state.current.q[L];
  resp.innerHTML = `<span class="resp-label">${UI.yourAnswer[L]}</span>`+
    `<input id="pr-input" class="answer-input" type="text" value="${esc(state.current._input||'')}" `+
    `oninput="savePracticeInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();revealCurrent();}" aria-label="${UI.yourAnswer[L]}">`;
  ans.innerHTML = `<span class="a-label">${UI.aLabel[L]}</span>${state.current.a[L]}`;
  card.classList.toggle('revealed', state.reveal);

  acts.innerHTML = state.reveal
    ? `<button class="btn btn-primary" onclick="nextProblem()">${UI.nextBtn[L]}</button>`
    : `<button class="btn btn-primary" onclick="revealCurrent()">${UI.revealShow[L]}</button>`+
      `<button class="btn btn-ghost" onclick="skipProblem()">${UI.skipBtn[L]}</button>`;

  if(state._focusInput){
    state._focusInput = false;
    const inp = document.getElementById('pr-input');
    if(inp) inp.focus();
  }
}

/* Escape a string for safe use inside an HTML attribute value */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* Persist what the user types so it survives re-renders */
function saveInput(idx,val){ if(state.problems[idx]) state.problems[idx]._input = val; }
function savePracticeInput(val){ if(state.current) state.current._input = val; }

/* Draw one fresh problem from the enabled categories, avoiding an immediate repeat */
function pickProblem(){
  const enabled = CATEGORIES.filter(c=>state.cats[c.id]);
  if(enabled.length===0) return null;
  const prevKey = state.current ? state.current.q.en.replace(/<[^>]+>/g,'') : null;
  let p, guard=0;
  do{ p = choice(enabled).gen(state.level); guard++; }
  while(prevKey && p.q.en.replace(/<[^>]+>/g,'')===prevKey && guard<40);
  return p;
}

/* ============================================================
   Controls
   ============================================================ */
function setLang(l){ state.lang=l; render(); }
function setMode(m){
  state.mode = m;
  document.body.classList.toggle('mode-practice', m==='practice');
  document.body.classList.toggle('mode-worksheet', m==='worksheet');
  if(m==='practice' && !state.current) nextProblem(); else render();
}
function refreshForMode(){
  if(state.mode==='practice'){ state.current = pickProblem(); state.reveal=false; render(); }
  else { newSet(); }
}
function setLevel(l){ state.level=l; refreshForMode(); }
function nextProblem(){ state.current = pickProblem(); state.reveal=false; state._focusInput=true; if(state.current) state.count++; render(); }
function revealCurrent(){ state.reveal=true; render(); }
function skipProblem(){ nextProblem(); }
function toggleAnswers(){
  state.showAnswers=!state.showAnswers;
  document.body.classList.toggle('show-answers', state.showAnswers);
  render();
}
function revealOne(btn, idx){
  const li = btn.closest('li');
  const now = li.classList.toggle('revealed');
  state.problems[idx]._revealed = now;
  btn.textContent = now ? UI.revealHide[state.lang] : UI.revealShow[state.lang];
}
function newSet(){ generateSet(); render(); }

function buildCats(){
  const box=document.getElementById('cats');
  box.innerHTML='';
  CATEGORIES.forEach(c=>{
    const lab=document.createElement('label');
    lab.className='cat'+(state.cats[c.id]?' on':'');
    lab.innerHTML =
      `<input type="checkbox" ${state.cats[c.id]?'checked':''}>`+
      `<span><span class="cat-name" data-name="${c.id}"></span><br><span class="cat-desc" data-desc="${c.id}"></span></span>`;
    const cb=lab.querySelector('input');
    cb.addEventListener('change',()=>{ state.cats[c.id]=cb.checked; lab.classList.toggle('on',cb.checked); refreshForMode(); });
    box.appendChild(lab);
  });
  refreshCatLabels();
}
function refreshCatLabels(){
  CATEGORIES.forEach(c=>{
    document.querySelectorAll(`[data-name="${c.id}"]`).forEach(el=>el.textContent=c.name[state.lang]);
    document.querySelectorAll(`[data-desc="${c.id}"]`).forEach(el=>el.textContent=c.desc[state.lang]);
  });
}

/* ============================================================
   Init
   ============================================================ */
buildCats();
document.body.classList.add('mode-practice');   // Practice is the default, friendlier view
newSet();          // prepare a worksheet too, so switching modes is instant
nextProblem();     // draw the first practice problem and render everything
</script>
