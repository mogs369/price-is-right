<title>The Price Is Right</title>

<!--
  ============================================================
  THE PRICE IS RIGHT
  A gentle, no-fail guessing game for people living with
  dementia. Designed for tablets and touch screens in care
  settings.

  HOW TO PLAY:
    1. Choose a level on the first screen.
    2. A familiar product and a price are shown.
    3. The player taps MORE or LESS to guess whether the real
       price is higher or lower than the price shown.
    4. The real price is revealed with warm feedback.
    5. Tap NEXT to move on at their own pace.

  THREE LEVELS (for different stages):
    🌼 Gentle  — no wrong answers; every guess is celebrated.
    ⭐ Medium  — prices are closer; correct answers earn prizes.
    🔥 Sharper — prices very close; build a streak of correct
                 answers. A miss only resets the streak — it is
                 always kind, never a "game over".

  No timers. No scolding. The harder levels add a gentle,
  encouraging challenge — never a punishing one.
  ============================================================
-->

<!--
  ============================================================
  CAREGIVER: EDIT THE PRODUCTS HERE
  ============================================================
  This is the ONLY part you need to change to swap products.

  Each product has these parts:
     emoji : a picture (an emoji). You can paste any emoji.
     en    : the product name in English.
     fr    : the product name in French.
     price : the REAL price of the item (a number).

  The game shows a "guess price" near the real price and asks
  whether the real price is MORE or LESS. How CLOSE that guess
  price is depends on the difficulty level the player picks on
  the first screen — so you only need to set the real price.

  Prices are just for fun — make them whatever feels familiar
  to the people you care for.
  ============================================================
-->

//

<script>
  // ---------- Game state ----------
  let rounds = 0;
  let order = [];          // shuffled list of product indexes
  let position = 0;        // where we are in the shuffled list
  let current = null;      // the product being shown right now
  let currentShown = 0;    // the "guess price" shown for the current product
  let currentLevel = null; // "easy" | "medium" | "hard" (null on start screen)
  let lang = "en";         // current language: "en" or "fr"
  let onReveal = false;    // is the reveal screen showing?
  let onPrize = false;     // is the prize celebration showing?
  let lastWasRight = false;// did the last guess match?
  let lastCheerIndex = 0;  // which cheer to repeat if language is switched
  let correctToward = 0;   // correct answers counted toward the next prize (Medium)
  let streak = 0;          // correct answers in a row (Sharper)
  let prizesWon = 0;       // how many prizes won so far (drives which prize is next)
  let pendingPrize = -1;   // a prize waiting to be celebrated after NEXT (-1 = none)
  let prizeShowing = -1;   // the prize currently on the celebration screen
  let latestPrizeIndex = -1; // best prize won so far (for the top-bar badge)

  // ---------- Audio: a cheerful little chime ----------
  // Uses the Web Audio API so we need no sound files (works offline).
  let audioCtx = null;
  function playChime() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99]; // a happy C-major chord arpeggio
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.55);
      });
    } catch (e) {
      // If sound is unavailable, the game still works fine silently.
    }
  }

  // A longer, more exciting fanfare for winning a prize.
  function playFanfare() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50]; // rising "ta-da!"
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + i * 0.14;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.35, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.5);
      });
    } catch (e) {
      // Silent fallback.
    }
  }

  // A soft, warm two-note tone for a "good try" (never a harsh buzzer).
  function playSoftTone() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [440.00, 392.00]; // gentle, reassuring descending step
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + i * 0.18;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.22, start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    } catch (e) {
      // Silent fallback.
    }
  }

  // ---------- Helpers ----------
  function money(value) {
    return CURRENCY + value.toFixed(2);
  }

  // Make a "guess price" that sits near the real price. How close it
  // is depends on the chosen difficulty level (closer = harder).
  function generateShown(price) {
    const lv = LEVELS[currentLevel];
    const margin = lv.marginLow + Math.random() * (lv.marginHigh - lv.marginLow);
    const goUp = Math.random() < 0.5;
    let shown = goUp ? price * (1 + margin) : price * (1 - margin);
    shown = Math.round(shown * 100) / 100;
    // Safety: never zero/negative, and never identical to the real price.
    if (shown <= 0) shown = 0.05;
    if (shown === price) shown = goUp ? price + 0.05 : Math.max(0.05, price - 0.05);
    return shown;
  }

  // Update the gentle progress indicator in the top bar.
  function updateProgress() {
    const t = TEXT[lang];
    const el = document.getElementById("progress");
    if (!currentLevel) { el.textContent = ""; return; }
    const lv = LEVELS[currentLevel];
    if (lv.prizeBy === "rounds") {
      el.textContent = t.rounds + rounds;            // "Rounds played: 3"
    } else if (lv.prizeBy === "correct") {
      el.textContent = "⭐ " + correctToward + " / " + lv.needed;
    } else {
      el.textContent = "🔥 " + streak + " / " + lv.needed;
    }
  }

  // Make a fresh shuffled order so products don't repeat in a row.
  function shuffle() {
    order = PRODUCTS.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    position = 0;
  }

  // ---------- Apply the current language to all on-screen text ----------
  function applyLanguage() {
    const t = TEXT[lang];
    document.documentElement.lang = lang;

    // Top bar + start screen labels.
    document.getElementById("langBtn").textContent = t.langButton;
    document.getElementById("startTitle").textContent = t.title;
    document.getElementById("chooseLevel").textContent = t.chooseLevel;
    document.getElementById("lvlEasy").textContent = t.lvlEasy;
    document.getElementById("lvlEasyDesc").textContent = t.lvlEasyDesc;
    document.getElementById("lvlMedium").textContent = t.lvlMedium;
    document.getElementById("lvlMediumDesc").textContent = t.lvlMediumDesc;
    document.getElementById("lvlHard").textContent = t.lvlHard;
    document.getElementById("lvlHardDesc").textContent = t.lvlHardDesc;

    // Play + reveal + prize labels.
    document.getElementById("pricePrompt").textContent = t.prompt;
    document.getElementById("btnMore").textContent = t.more;
    document.getElementById("btnLess").textContent = t.less;
    document.getElementById("btnNext").textContent = t.next;
    document.getElementById("prizeCheer").textContent = t.prizeCheer;
    document.getElementById("prizeIntro").textContent = t.prizeIntro;
    document.getElementById("btnContinue").textContent = t.prizeContinue;

    updateProgress();

    // Refresh whichever play screen is currently visible.
    if (current) {
      document.getElementById("guessName").textContent = current[lang];
    }
    if (onReveal) {
      const failLevel = currentLevel && LEVELS[currentLevel].fail;
      if (!failLevel) {
        // Gentle level: always warm wording.
        document.getElementById("revealCheer").textContent = t.cheers[lastCheerIndex];
        document.getElementById("revealText").textContent =
          lastWasRight ? t.gotIt : t.closeGuess;
      } else if (lastWasRight) {
        document.getElementById("revealCheer").textContent = t.rightCheer;
        document.getElementById("revealText").textContent = t.rightText;
      } else {
        document.getElementById("revealCheer").textContent = t.wrongCheer;
        document.getElementById("revealText").textContent = t.wrongText;
      }
    }
    if (onPrize && prizeShowing >= 0) {
      document.getElementById("prizeName").textContent = PRIZES[prizeShowing][lang];
    }
  }

  // ---------- Switch between English and French ----------
  function toggleLanguage() {
    lang = (lang === "en") ? "fr" : "en";
    applyLanguage();
  }

  // ---------- Show a product to guess ----------
  function showGuess() {
    if (position >= order.length) shuffle(); // reshuffle when we run out
    current = PRODUCTS[order[position]];
    position++;
    currentShown = generateShown(current.price);
    onReveal = false;

    document.getElementById("guessEmoji").textContent = current.emoji;
    document.getElementById("guessName").textContent = current[lang];
    document.getElementById("guessShown").textContent = money(currentShown) + "?";

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("guessScreen").classList.remove("hidden");
    document.getElementById("revealScreen").classList.add("hidden");
    document.getElementById("prizeScreen").classList.add("hidden");
  }

  // ---------- Player taps MORE or LESS ----------
  function makeGuess(choice) {
    const t = TEXT[lang];
    const lv = LEVELS[currentLevel];

    // Work out whether the guess matched the real price.
    const realIsMore = current.price > currentShown;
    lastWasRight = (choice === "more" && realIsMore) ||
                   (choice === "less" && !realIsMore);

    rounds++;

    // ----- Feedback wording, icon, colour and sound -----
    const icon  = document.getElementById("revealIcon");
    const cheer = document.getElementById("revealCheer");

    if (!lv.fail) {
      // GENTLE level: no wrong answers. Always warm and celebratory.
      lastCheerIndex = rounds % t.cheers.length;
      cheer.textContent = t.cheers[lastCheerIndex];
      cheer.style.color = "#2e7d32";
      icon.textContent = "✅";
      document.getElementById("revealText").textContent =
        lastWasRight ? t.gotIt : t.closeGuess;
      playChime();
    } else if (lastWasRight) {
      // MEDIUM / SHARPER, correct: a clear, happy "yes!"
      cheer.textContent = t.rightCheer;
      cheer.style.color = "#2e7d32";
      icon.textContent = "✅";
      document.getElementById("revealText").textContent = t.rightText;
      playChime();
    } else {
      // MEDIUM / SHARPER, not quite: kind and encouraging, never harsh.
      cheer.textContent = t.wrongCheer;
      cheer.style.color = "#ef6c00";   // warm amber, not alarming red
      icon.textContent = "💛";
      document.getElementById("revealText").textContent = t.wrongText;
      playSoftTone();
    }

    document.getElementById("revealEmoji").textContent = current.emoji;
    document.getElementById("revealPrice").textContent = money(current.price);

    // ----- Prize progress, depending on the level -----
    if (lv.prizeBy === "rounds") {
      // Won just by taking part.
      if (rounds % lv.needed === 0) awardPrize();
    } else if (lv.prizeBy === "correct") {
      // Won by getting answers right (a wrong one simply doesn't count).
      if (lastWasRight) {
        correctToward++;
        if (correctToward >= lv.needed) { awardPrize(); correctToward = 0; }
      }
    } else { // "streak"
      // Won by a run of correct answers. A miss gently resets the run —
      // the kindest form of "fail": you just start a fresh streak.
      if (lastWasRight) {
        streak++;
        if (streak >= lv.needed) { awardPrize(); streak = 0; }
      } else {
        streak = 0;
      }
    }

    updateProgress();

    // Switch to the reveal screen with a little pop.
    onReveal = true;
    const reveal = document.getElementById("revealScreen");
    document.getElementById("guessScreen").classList.add("hidden");
    reveal.classList.remove("hidden");
    reveal.classList.remove("pop");
    void reveal.offsetWidth; // restart the animation
    reveal.classList.add("pop");
  }

  // ---------- Queue up the next prize to celebrate ----------
  function awardPrize() {
    pendingPrize = Math.min(prizesWon, PRIZES.length - 1);
    prizesWon++;
  }

  // ---------- Move on after the reveal ----------
  // If a prize is waiting, celebrate it first; otherwise next product.
  function nextRound() {
    if (pendingPrize >= 0) {
      showPrize(pendingPrize);
      pendingPrize = -1;
    } else {
      showGuess();
    }
  }

  // ---------- Show the prize celebration ----------
  function showPrize(index) {
    const t = TEXT[lang];
    const prize = PRIZES[index];
    prizeShowing = index;
    onReveal = false;
    onPrize = true;

    // Keep the best prize in the top-bar badge as a happy reminder.
    if (index > latestPrizeIndex) latestPrizeIndex = index;
    const badge = document.getElementById("prizeBadge");
    document.getElementById("prizeBadgeEmoji").textContent = PRIZES[latestPrizeIndex].emoji;
    badge.classList.remove("hidden");

    document.getElementById("prizeCheer").textContent = t.prizeCheer;
    document.getElementById("prizeIntro").textContent = t.prizeIntro;
    document.getElementById("prizeEmoji").textContent = prize.emoji;
    document.getElementById("prizeName").textContent = prize[lang];

    document.getElementById("guessScreen").classList.add("hidden");
    document.getElementById("revealScreen").classList.add("hidden");
    const screen = document.getElementById("prizeScreen");
    screen.classList.remove("hidden");

    // Make the prize emoji wiggle excitedly.
    const emoji = document.getElementById("prizeEmoji");
    emoji.classList.remove("wiggle");
    void emoji.offsetWidth;
    emoji.classList.add("wiggle");

    playFanfare();
  }

  // ---------- Carry on after celebrating a prize ----------
  function continueFromPrize() {
    onPrize = false;
    showGuess();
  }

  // ---------- Begin a game at the chosen level ----------
  function startGame(level) {
    currentLevel = level;
    // Fresh start for every new game.
    rounds = 0;
    correctToward = 0;
    streak = 0;
    prizesWon = 0;
    latestPrizeIndex = -1;
    pendingPrize = -1;
    onReveal = false;
    onPrize = false;

    document.getElementById("homeBtn").classList.remove("hidden");
    document.getElementById("prizeBadge").classList.add("hidden");

    shuffle();
    showGuess();
    updateProgress();
  }

  // ---------- Return to the level-choosing screen ----------
  function showStart() {
    currentLevel = null;
    current = null;
    onReveal = false;
    onPrize = false;

    document.getElementById("startScreen").classList.remove("hidden");
    document.getElementById("guessScreen").classList.add("hidden");
    document.getElementById("revealScreen").classList.add("hidden");
    document.getElementById("prizeScreen").classList.add("hidden");

    document.getElementById("homeBtn").classList.add("hidden");
    document.getElementById("prizeBadge").classList.add("hidden");
    document.getElementById("progress").textContent = "";
  }

  // ---------- First load: show the level screen ----------
  applyLanguage();
  showStart();
</script>

</body>
</html>
